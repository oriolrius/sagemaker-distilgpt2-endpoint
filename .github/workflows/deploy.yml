name: Deploy Full Stack

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: 'CloudFormation stack name'
        type: string
        default: 'openai-sagemaker-stack'
      model_id:
        description: 'HuggingFace model ID'
        type: string
        default: 'Qwen/Qwen2.5-1.5B-Instruct'
      sagemaker_instance:
        description: 'SageMaker instance type'
        type: choice
        options:
          - ml.g4dn.xlarge
          - ml.g4dn.2xlarge
          - ml.g5.xlarge
          - ml.g5.2xlarge
        default: 'ml.g4dn.xlarge'

jobs:
  deploy:
    name: Deploy SageMaker + API Gateway + OpenWebUI (Fargate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS Account: $ACCOUNT_ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Lambda function
        run: |
          echo "Creating Lambda deployment package..."
          mkdir -p .build/package
          pip install boto3 --target .build/package --quiet
          cp -r lambda/openai-proxy/src/* .build/package/
          cd .build/package && zip -r ../lambda-openai-proxy.zip . -q
          echo "Lambda package created: $(du -h ../*.zip | cut -f1)"

      - name: Set S3 bucket name
        id: s3
        run: |
          BUCKET="${{ inputs.stack_name }}-lambda-${{ steps.aws.outputs.account_id }}-${{ secrets.AWS_REGION }}"
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET"

      - name: Create S3 bucket
        run: |
          BUCKET="${{ steps.s3.outputs.bucket }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists: $BUCKET"
          else
            echo "Creating bucket: $BUCKET"
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "${{ secrets.AWS_REGION }}" \
              --create-bucket-configuration LocationConstraint="${{ secrets.AWS_REGION }}"
          fi

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp .build/lambda-openai-proxy.zip \
            "s3://${{ steps.s3.outputs.bucket }}/lambda/${{ inputs.stack_name }}/lambda-openai-proxy.zip"
          echo "Lambda uploaded to S3"

      - name: Deploy CloudFormation stack
        run: |
          echo "Deploying CloudFormation stack: ${{ inputs.stack_name }}"
          echo "This may take ~7-10 minutes (SageMaker endpoint startup)..."

          aws cloudformation deploy \
            --region "${{ secrets.AWS_REGION }}" \
            --stack-name "${{ inputs.stack_name }}" \
            --template-file infra/full-stack.yaml \
            --parameter-overrides \
              HuggingFaceModelId="${{ inputs.model_id }}" \
              SageMakerInstanceType="${{ inputs.sagemaker_instance }}" \
              VpcId="${{ secrets.VPC_ID }}" \
              SubnetId="${{ secrets.SUBNET_ID }}" \
              LambdaS3Bucket="${{ steps.s3.outputs.bucket }}" \
              LambdaS3Key="lambda/${{ inputs.stack_name }}/lambda-openai-proxy.zip" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "CloudFormation deployment complete"

      - name: Get stack outputs
        id: outputs
        run: |
          echo "Fetching stack outputs..."

          API_URL=$(aws cloudformation describe-stacks \
            --region "${{ secrets.AWS_REGION }}" \
            --stack-name "${{ inputs.stack_name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayEndpoint'].OutputValue" \
            --output text)

          ENDPOINT_NAME=$(aws cloudformation describe-stacks \
            --region "${{ secrets.AWS_REGION }}" \
            --stack-name "${{ inputs.stack_name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SageMakerEndpointName'].OutputValue" \
            --output text)

          ECS_CLUSTER=$(aws cloudformation describe-stacks \
            --region "${{ secrets.AWS_REGION }}" \
            --stack-name "${{ inputs.stack_name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ECSClusterName'].OutputValue" \
            --output text)

          ECS_SERVICE=$(aws cloudformation describe-stacks \
            --region "${{ secrets.AWS_REGION }}" \
            --stack-name "${{ inputs.stack_name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ECSServiceName'].OutputValue" \
            --output text)

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "endpoint_name=$ENDPOINT_NAME" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$ECS_CLUSTER" >> $GITHUB_OUTPUT
          echo "ecs_service=$ECS_SERVICE" >> $GITHUB_OUTPUT

          echo "API Gateway: $API_URL"
          echo "SageMaker Endpoint: $ENDPOINT_NAME"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"

      - name: Get Fargate task public IP
        id: fargate
        run: |
          echo "Waiting for Fargate task to get a public IP..."
          OPENWEBUI_IP=""
          for i in {1..30}; do
            TASK_ARN=$(aws ecs list-tasks \
              --region "${{ secrets.AWS_REGION }}" \
              --cluster "${{ steps.outputs.outputs.ecs_cluster }}" \
              --service-name "${{ steps.outputs.outputs.ecs_service }}" \
              --query "taskArns[0]" \
              --output text 2>/dev/null || echo "None")

            if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
              ENI_ID=$(aws ecs describe-tasks \
                --region "${{ secrets.AWS_REGION }}" \
                --cluster "${{ steps.outputs.outputs.ecs_cluster }}" \
                --tasks "$TASK_ARN" \
                --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
                --output text 2>/dev/null || echo "")

              if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
                OPENWEBUI_IP=$(aws ec2 describe-network-interfaces \
                  --region "${{ secrets.AWS_REGION }}" \
                  --network-interface-ids "$ENI_ID" \
                  --query "NetworkInterfaces[0].Association.PublicIp" \
                  --output text 2>/dev/null || echo "")

                if [ -n "$OPENWEBUI_IP" ] && [ "$OPENWEBUI_IP" != "None" ]; then
                  echo "Fargate task IP: $OPENWEBUI_IP"
                  echo "openwebui_ip=$OPENWEBUI_IP" >> $GITHUB_OUTPUT
                  break
                fi
              fi
            fi

            echo "Attempt $i/30: waiting for task IP..."
            sleep 10
          done

          if [ -z "$OPENWEBUI_IP" ] || [ "$OPENWEBUI_IP" == "None" ]; then
            echo "Warning: Could not get Fargate task IP yet"
            echo "openwebui_ip=" >> $GITHUB_OUTPUT
          fi

      - name: Wait for OpenWebUI to be ready
        if: steps.fargate.outputs.openwebui_ip != ''
        run: |
          echo "Waiting for OpenWebUI to be ready..."
          for i in {1..30}; do
            if curl -sf "http://${{ steps.fargate.outputs.openwebui_ip }}:8080" -o /dev/null 2>/dev/null; then
              echo "OpenWebUI is ready!"
              exit 0
            fi
            echo "Attempt $i/30: OpenWebUI not ready yet, waiting 10s..."
            sleep 10
          done
          echo "Warning: OpenWebUI may still be starting up"

      - name: Test API Gateway
        run: |
          echo "Testing API Gateway endpoints..."

          echo "GET /v1/models:"
          curl -sf "${{ steps.outputs.outputs.api_url }}/v1/models" | head -c 500
          echo ""

          echo "POST /v1/chat/completions:"
          curl -sf -X POST "${{ steps.outputs.outputs.api_url }}/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"messages": [{"role": "user", "content": "Hello"}], "max_tokens": 20}' | head -c 500
          echo ""

      - name: Deployment Summary
        run: |
          OPENWEBUI_URL=""
          if [ -n "${{ steps.fargate.outputs.openwebui_ip }}" ]; then
            OPENWEBUI_URL="http://${{ steps.fargate.outputs.openwebui_ip }}:8080"
          else
            OPENWEBUI_URL="(pending — check ECS console)"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Complete

          | Resource | Value |
          |----------|-------|
          | Stack Name | \`${{ inputs.stack_name }}\` |
          | Model | \`${{ inputs.model_id }}\` |
          | SageMaker Instance | \`${{ inputs.sagemaker_instance }}\` |

          ### Endpoints

          | Service | URL |
          |---------|-----|
          | API Gateway | ${{ steps.outputs.outputs.api_url }} |
          | OpenWebUI | ${OPENWEBUI_URL} |
          | SageMaker Endpoint | \`${{ steps.outputs.outputs.endpoint_name }}\` |
          | ECS Cluster | \`${{ steps.outputs.outputs.ecs_cluster }}\` |

          ### Test Commands

          \`\`\`bash
          # List models
          curl ${{ steps.outputs.outputs.api_url }}/v1/models

          # Chat completion
          curl -X POST ${{ steps.outputs.outputs.api_url }}/v1/chat/completions \\
            -H "Content-Type: application/json" \\
            -d '{"messages": [{"role": "user", "content": "Hello"}], "max_tokens": 50}'
          \`\`\`

          ### Cost Warning

          This stack costs approximately **\$0.80/hour** (\$19/day).

          **Remember to destroy the stack when done testing!**
          EOF
